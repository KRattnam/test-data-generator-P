[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-data-generator"
version = "1.0.0"
description = "Stateful, logic-driven MDMS test data generation service"
requires-python = ">=3.14,<3.15"

dependencies = [
    # API Framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",

    # Data Validation
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",

    # Database
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.4",

    # Task queues
    "celery>=5.4,<6",
    "redis>=5.1,<7",

    # Data Generation
    "faker>=30.3,<40",

    # Observability
    "prometheus-client>=0.21,<1",

    # Utilities
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0.2,<7",
    "python-ulid>=2.7,<4",
    "httpx>=0.27,<1",
    "structlog>=24.4,<30"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.6.9,<1",
    "mypy>=1.11,<2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tdg*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]