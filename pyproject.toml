[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "test-data-generator"
version = "1.0.0"
description = "Stateful, logic-driven MDMS test data generation service"
requires-python = ">=3.11"

dependencies = [
    # API Framework ----
    "fastapi==0.115.0", # Rest API Framework - fast, modern, async
    "uvicorn[standard]==0.30.6", #ASGI Server that runs Fast API

    # Data Validation ----
    "pydantic==2.9.2", # Data Models + Validation ( FASTAPI will use this)
    #pydantic-settings==2.5.2", # Reads config from .env files

    # Database ----
    "sqlalchemy==2.0.35", # ORM - mals python classes to DB tables
    "alembic==1.13.3", # DB migration tool - version controls schema
    "asyncpg==0.29.0", # Async PostgreSQL driver (fast)
    #psycopg2-binary==2.9.9", # Sync PostgreSQL driver (alembic needs this)

    # Task queues ---
    "celery==5.4.0", # Async Task queue - runs generation jobs
    "redis==5.1.0", # Redis Client - Celery's message broker

    # Data Generation ---
    "faker==30.3.0", # Generates realistic fake names, addresses etc.

    # Observability ---
    "proometheus-client==0.21.0", # Exposes /metrics endpoint for proometheus

    # Utilities ---
    "python-dotenv==1.0.1", # Load .env file into environment
    "pyyaml==6.0.2", # Parse YAML Profile files
    "python-ulid==2.7.0", # Better Ids than UUID for sortable keys
    "httpx=0.27.2", # Async HTTP client ( for health checks)
    "structlog==24.4.0", # Structured JSON logging

]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2", # Test client for fastapi
    "ruff==0.6.9", # Liner + formatter
    "mypy==1.11.2", # Type Checker
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tdg*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]